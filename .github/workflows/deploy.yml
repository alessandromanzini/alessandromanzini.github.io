# Builds and publishes the site on every push to main.
# Regenerates preview.jpg (the link-preview image) from the current portfolio.pdf first,
# so swapping the PDF is all it takes to update the site and its previews.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to date the latest portfolio.pdf change

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate link preview image
        run: |
          pip install pymupdf
          python tools/make-preview.py

      - name: Collect site files
        run: >
          rsync -a ./ _site/
          --exclude .git --exclude .github --exclude .claude --exclude .gitignore
          --exclude tools --exclude README.md --exclude .DS_Store --exclude _site

      - name: Stamp portfolio date
        run: |
          PDF_DATE=$(git log -1 --format=%cI -- portfolio.pdf)
          sed -i -E "s|content=\"[^\"]*\" data-pdf-date|content=\"$PDF_DATE\" data-pdf-date|" _site/index.html
          grep data-pdf-date _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
